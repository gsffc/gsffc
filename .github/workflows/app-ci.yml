name: App CI

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pre-#2 the directory holds only a README; nothing to build yet.
      - name: Install and check app
        working-directory: app
        run: |
          if [ ! -f package.json ]; then
            echo "app/ not onboarded yet (#2) — skipping"
            exit 0
          fi
          npm ci
          find . -name node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -n1 node --check
