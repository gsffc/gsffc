<figure class="image">
  <video class="centered" autoplay loop muted playsinline{% if include.description %} aria-label="{{ include.description | strip_html | escape }}"{% endif %}>
    <source src="{{ include.url | absolute_url }}" type="video/webm">
  </video>
  {% if include.description %}<figcaption>{{ include.description }}</figcaption>{% endif %}
</figure>
