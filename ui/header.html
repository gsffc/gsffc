<!-- Shared header shell — source of truth. Do NOT edit generated copies
     (site/_includes/shared-header.liquid, app/views/partials/shared-header.ejs).
     Regenerate with: npm run ui:build

     Markers substituted per target by ui/build.mjs:
       {{LOGO_URL}} and {{UI_ASSET_PREFIX}} (written here without braces):
       logo URL and ui-asset prefix for the target host.
       Slot comment (at-sign slot : site-nav): per-site internal nav (ui/slots/). -->
<header class="gsf-header">
  <div class="gsf-header-inner">
    <a class="gsf-brand" href="https://www.gsffc.org/">
      <img class="gsf-brand-logo" src="{{LOGO_URL}}" alt="GSF" />
      <span class="gsf-brand-name-full">GSF足球俱乐部</span><span class="gsf-brand-name-short">GSF</span>
    </a>
    <!-- @slot:site-nav -->
    <nav class="gsf-cross-nav">
      <a href="https://www.gsffc.org/">战报</a>
      <a href="https://app.gsffc.org/">活动报名</a>
    </nav>
    <div class="gsf-login-corner" data-login-corner>
      <a class="gsf-login-link" href="https://app.gsffc.org/login">登录</a>
    </div>
  </div>
  <script src="{{UI_ASSET_PREFIX}}/login-corner.js" defer></script>
</header>
