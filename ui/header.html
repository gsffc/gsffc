<!-- Shared header shell — source of truth. Do NOT edit generated copies
     (site/_includes/shared-header.liquid, app/views/partials/shared-header.ejs).
     Regenerate with: npm run ui:build

     Markers substituted per target by ui/build.mjs (written brace-less here
     so the generator doesn't eat this comment):
       BRAND_NAME — brand name per site (language-aware on www)
       LOGO_URL / UI_ASSET_PREFIX — logo URL and ui-asset prefix per host
       CROSS_ACTIVE_NEWS / CROSS_ACTIVE_APP — active-state class injection
       slot comments (at-sign slot : site-nav / login-corner) —
       per-site internal nav and login corner (ui/slots/) -->
<header class="gsf-header">
  <div class="gsf-header-inner">
    <a class="gsf-brand" href="https://www.gsffc.org/">
      <img class="gsf-brand-logo" src="{{LOGO_URL}}" alt="GSF" />
      <span class="gsf-brand-name-full">{{BRAND_NAME}}</span><span class="gsf-brand-name-short">GSF</span>
    </a>
    <nav class="gsf-cross-nav">
      <a href="https://www.gsffc.org/"{{CROSS_ACTIVE_NEWS}}>战报</a>
      <a href="https://app.gsffc.org/"{{CROSS_ACTIVE_APP}}>会员 app</a>
    </nav>
    <!-- @slot:site-nav -->
    <!-- @slot:login-corner -->
  </div>
</header>
